<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My games &middot; {{ bot_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1><span class="bot-name">{{ bot_name }}</span> &middot; My games</h1>
    <nav class="account-nav">
      <a class="navlink" href="{{ url_for('index') }}">Home</a>
      <button id="logoutBtn" type="button" class="navlink btnlink">Log out</button>
    </nav>
  </header>

  <main class="history-layout">
    {% if not games %}
      <p class="empty">No games yet. <a href="{{ url_for('index') }}">Play one!</a></p>
    {% else %}

    <!-- COLLECTIONS tree. Per-user nestable folders (built client-side from
         window.HISTORY_COLLECTIONS by history.js). Create/rename/delete
         folders + subfolders, and filter the games list by the selected
         folder. Expand/collapse and the create-form use the [hidden]
         attribute; all colors stay in the 8-color palette. -->
    <section class="collections-panel" id="collectionsPanel">
      <div class="collections-head">
        <h2>Collections</h2>
        <button type="button" class="btn btn-small" id="collNewRoot">New folder</button>
      </div>
      <ul class="collections-tree" id="collectionsTree">
        <!-- Rendered client-side by history.js. The 'All games' root is first. -->
      </ul>
    </section>

    <!-- Sort + filter controls. All driven client-side by history.js over the
         embedded games JSON (below). Filter panels default hidden via the
         [hidden] attribute (the global rule governs show/hide). -->
    <div class="history-toolbar">
      <div class="sort-control">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="default" selected>Default</option>
          <option value="date_asc">Date (ascending)</option>
          <option value="date_desc">Date (descending)</option>
        </select>
      </div>

      <div class="disclosure filter-disclosure" id="filterTab">
        <button type="button" class="disclosure-toggle" id="filterToggle" aria-expanded="false">
          Filters <span class="arrow">&#x25B8;</span>
        </button>
        <div class="disclosure-body filter-body" id="filterBody" hidden>

          <!-- RESULT (multi-select win/draw/loss, relative to the human) with a
               reason sub-filter over the canonical reason categories. -->
          <fieldset class="filter-group">
            <legend>Result</legend>
            <label><input type="checkbox" class="f-result" value="win" /> Win</label>
            <label><input type="checkbox" class="f-result" value="draw" /> Draw</label>
            <label><input type="checkbox" class="f-result" value="loss" /> Loss</label>
            <div class="filter-sub">
              <span class="sub-label">Reason</span>
              <label><input type="checkbox" class="f-reason" value="checkmate" /> checkmate</label>
              <label><input type="checkbox" class="f-reason" value="resignation" /> resignation</label>
              <label><input type="checkbox" class="f-reason" value="timeout" /> timeout</label>
              <label><input type="checkbox" class="f-reason" value="3-fold repetition" /> 3-fold repetition</label>
              <label><input type="checkbox" class="f-reason" value="stalemate" /> stalemate</label>
              <label><input type="checkbox" class="f-reason" value="insufficient material" /> insufficient material</label>
              <label><input type="checkbox" class="f-reason" value="50-move rule" /> 50-move rule</label>
            </div>
          </fieldset>

          <!-- DATE RANGE on the START date. -->
          <fieldset class="filter-group">
            <legend>Date range (start)</legend>
            <label>From <input type="date" id="fDateFrom" /></label>
            <label>To <input type="date" id="fDateTo" /></label>
          </fieldset>

          <!-- TIME CONTROL: exactly blitz/rapid/classical/unlimited/custom.
               NO bullet. 'custom' does NOT mean 'any time-limited game'; it
               lets the player match a SPECIFIC base time + increment (revealed
               below when 'custom' is checked). Unlimited games never match
               'custom'. -->
          <fieldset class="filter-group">
            <legend>Time control</legend>
            <label><input type="checkbox" class="f-tc" value="blitz" /> blitz</label>
            <label><input type="checkbox" class="f-tc" value="rapid" /> rapid</label>
            <label><input type="checkbox" class="f-tc" value="classical" /> classical</label>
            <label><input type="checkbox" class="f-tc" value="unlimited" /> unlimited</label>
            <label><input type="checkbox" class="f-tc" value="custom" id="fTcCustom" /> custom</label>
            <!-- Custom base+increment inputs. Hidden until 'custom' is checked
                 (show/hide via the [hidden] attribute). Base is h/m/s; the
                 increment is in seconds. A game matches only when its
                 base_seconds and increment equal these values exactly. -->
            <div class="filter-sub custom-tc" id="customTcInputs" hidden>
              <span class="sub-label">Base</span>
              <label>h <input type="number" id="fCustomH" min="0" step="1" value="0" size="3" /></label>
              <label>m <input type="number" id="fCustomM" min="0" step="1" value="0" size="3" /></label>
              <label>s <input type="number" id="fCustomS" min="0" step="1" value="0" size="3" /></label>
              <span class="sub-label">Increment</span>
              <label>s <input type="number" id="fCustomInc" min="0" step="1" value="0" size="3" /></label>
            </div>
          </fieldset>

          <!-- COLOR (the human's color). -->
          <fieldset class="filter-group">
            <legend>Color</legend>
            <label><input type="checkbox" class="f-color" value="white" /> White</label>
            <label><input type="checkbox" class="f-color" value="black" /> Black</label>
          </fieldset>

          <!-- MODE (fide/rated/casual). -->
          <fieldset class="filter-group">
            <legend>Mode</legend>
            <label><input type="checkbox" class="f-mode" value="fide" /> FIDE-rated</label>
            <label><input type="checkbox" class="f-mode" value="rated" /> Rated</label>
            <label><input type="checkbox" class="f-mode" value="casual" /> Casual</label>
          </fieldset>

          <!-- ECO CODE (substring/prefix match on the classified code). -->
          <fieldset class="filter-group">
            <legend>ECO code</legend>
            <label>Code <input type="text" id="fEco" placeholder="e.g. C60" size="8" /></label>
          </fieldset>

          <button type="button" class="btn btn-small" id="filterClear">Clear filters</button>
        </div>
      </div>
    </div>

    <table class="history-table">
      <thead>
        <tr>
          <th>Date</th><th>Result</th><th></th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <!-- Rows are rendered client-side by history.js from HISTORY_GAMES. -->
      </tbody>
    </table>
    <p class="empty" id="noMatch" hidden>No games match these filters.</p>
    {% endif %}
  </main>

  <!-- Embed the games list as JSON so history.js can filter/sort without an
       extra request (mirrors how index.html embeds CHESS_AMATEUR). Each game
       carries: id, started_at, ended_at (or null), result, result_reason (raw
       code), human_color, base_seconds, increment, mode, eco_code, eco_name,
       status, date. -->
  <script>
    window.HISTORY_GAMES = {{ games | tojson }};
    window.HISTORY_COLLECTIONS = {{ collections | tojson }};
    window.HISTORY_INDEX_URL = {{ url_for('index') | tojson }};
  </script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
  <script src="{{ url_for('static', filename='history.js') }}"></script>
</body>
</html>
