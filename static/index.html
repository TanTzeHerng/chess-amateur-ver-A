<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Amateur</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Play vs <span class="bot-name">Chess Amateur</span></h1>
  </header>

  <main class="layout">
    <section class="board-area">
      <div class="opponent-strip" id="opponentStrip">
        <span class="opponent-label">Opponent: <span class="bot-name">Chess Amateur</span> <span class="threads-badge" id="threadsBadge"></span></span>
        <span class="thinking" id="thinking" hidden>Chess Amateur is thinking&hellip;</span>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      </div>

      <div class="banner" id="banner" hidden></div>
    </section>

    <aside class="panel">
      <div class="controls">
        <fieldset class="color-choice">
          <legend>Play as</legend>
          <label><input type="radio" name="color" value="white" checked /> White</label>
          <label><input type="radio" name="color" value="black" /> Black</label>
        </fieldset>
        <div class="threads-choice">
          <label for="threads">Engine threads</label>
          <input type="number" id="threads" name="threads" value="128" min="1" max="128" step="1" />
          <p class="hint">Lower this on small servers (1&ndash;2).</p>
        </div>
        <button id="newGame" type="button" class="btn">New Game</button>
      </div>

      <div class="status-block">
        <div class="turn-indicator" id="turnIndicator">Loading&hellip;</div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </div>

      <div class="movelog-block">
        <h2>Move log</h2>
        <ol class="movelog" id="moveLog"></ol>
      </div>
    </aside>
  </main>

  <!-- Promotion picker overlay -->
  <div id="promoOverlay" class="promo-overlay" hidden>
    <div class="promo-box">
      <p>Promote to:</p>
      <div class="promo-choices" id="promoChoices"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
